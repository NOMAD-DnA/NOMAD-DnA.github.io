<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야지 직진 · NOMAD</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"><style>:root{--bg:#f4f6f9;--card:#fff;--fg:#172131;--muted:#5d6878;--line:#dfe4ea;--accent:#1f5fd1;--accent-soft:#e6eefc;
--ok:#18794e;--ok-soft:#e2f4ea;--warn:#a35c00;--warn-soft:#fcefdc;--bad:#b4232b;--bad-soft:#fbe6e7;--new:#6a3fd6;--new-soft:#efe9fd;--old:#7b8494;
--s1:#2e9d4f;--s2:#f28e2b;--s3:#8e5bd1;--s4:#3b7ddd;--s5:#f2b705;--s6:#b0b0b0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11161e;--card:#19202b;--fg:#e7ebf1;--muted:#9aa4b2;--line:#2c3542;--accent:#7aa2ff;--accent-soft:#1d2a44;
--ok:#5fd09a;--ok-soft:#163327;--warn:#f0ad55;--warn-soft:#3a2a14;--bad:#ff7b82;--bad-soft:#3a1a1d;--new:#b49bff;--new-soft:#271f45;--old:#8a93a3;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
header.top .brand{font-weight:900;letter-spacing:.02em;text-decoration:none;color:var(--fg)}
header.top nav{display:flex;flex-wrap:wrap;gap:4px}
header.top nav a{text-decoration:none;color:var(--muted);font-size:.9rem;padding:3px 10px;border-radius:999px}
header.top nav a.on,header.top nav a:hover{background:var(--accent-soft);color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.crumb{font-size:.84rem;color:var(--muted);margin:2px 0 10px}.crumb a{text-decoration:none}
h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:-.01em}h2{font-size:1.2rem;margin:28px 0 10px}h3{font-size:1rem;margin:18px 0 6px}
p.lead{color:var(--muted);margin:0 0 14px;max-width:80ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line);display:block}
.card .im{position:relative}.card .dt{position:absolute;left:8px;top:8px;background:rgba(10,12,15,.78);color:#fff;font-weight:700;padding:3px 9px;border-radius:7px;font-size:.88rem;letter-spacing:.01em}
.card .b{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card b{font-size:1rem;line-height:1.35}.card .d{font-size:.86rem;color:var(--muted)}
.big{grid-column:span 2}@media(max-width:640px){.big{grid-column:auto}}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:6px}
.t{font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.t.ok{background:var(--ok-soft);color:var(--ok)}.t.warn{background:var(--warn-soft);color:var(--warn)}.t.bad{background:var(--bad-soft);color:var(--bad)}
.t.new{background:var(--new-soft);color:var(--new);font-weight:700}.t.old{background:transparent;border:1px solid var(--line);color:var(--old)}
.part{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.part.old{opacity:.86}.part h2{margin-top:0}
.ptitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ptitle .n{font:700 .8rem/1 ui-monospace,monospace;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 12px}
.bar button{font:inherit;font-size:.85rem;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.bar button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
.bar input{font:inherit;font-size:.88rem;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:180px;flex:1;max-width:280px}
.count{font-size:.82rem;color:var(--muted)}
.mini{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:4px}.mini i{display:block;height:100%}
.sbar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0}.sbar i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-style:normal;white-space:nowrap;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted)}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;background:var(--c);vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:var(--card)}th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500;font-size:.82rem}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.kpi b{display:block;font-size:1.25rem}.kpi span{font-size:.78rem;color:var(--muted)}
video{width:100%;background:#000;border-radius:10px;display:block}
.vtabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.vtabs button,.jump{font:inherit;font-size:.85rem;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.vtabs button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:700}
.jump{border-color:var(--bad);color:var(--bad);padding:2px 10px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:8px 0}details summary{cursor:pointer;font-weight:700}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:.92rem}
.memo{border-left-color:var(--new)}
img.full{width:100%;border-radius:10px;border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:24px;font-size:.9rem}
footer{max-width:1100px;margin:0 auto;padding:0 16px 40px;font-size:.8rem;color:var(--muted)}
