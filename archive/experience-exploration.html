    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #offroad-adaptive-sim .compare-side.right { text-align:right; }

    #offroad-adaptive-sim .compare-arrow { color:var(--viz-series-1); }

    #offroad-adaptive-sim svg .small-label { fill:var(--muted-foreground); font-size:16px; font-weight:400; }
    #offroad-adaptive-sim svg .route-base { fill:none; stroke:var(--sim-road); stroke-width:34; stroke-linecap:round; stroke-linejoin:round; }
    #offroad-adaptive-sim svg .route-edge { fill:none; stroke:var(--sim-road-edge); stroke-width:39; opacity:.35; stroke-linecap:round; stroke-linejoin:round; }
    #offroad-adaptive-sim svg .route-active { fill:none; stroke:var(--viz-series-1); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; filter:url(#softGlow); }
    #offroad-adaptive-sim svg .route-old { fill:none; stroke:var(--muted-foreground); stroke-width:5; stroke-linecap:round; stroke-dasharray:10 10; opacity:.7; }
    #offroad-adaptive-sim svg .cost-zone { fill:var(--sim-low-cost); opacity:.18; transition:fill .35s ease, opacity .35s ease; }
    #offroad-adaptive-sim svg .cost-zone.hot { fill:var(--sim-high-cost); opacity:.55; }
    #offroad-adaptive-sim svg .contour { fill:none; stroke:color-mix(in srgb, var(--foreground) 22%, transparent); stroke-width:1.2; }
    #offroad-adaptive-sim svg .tree-trunk { fill:var(--sim-near); }
    #offroad-adaptive-sim svg .rock { fill:color-mix(in srgb, var(--muted-foreground) 55%, var(--sim-ground)); }
    #offroad-adaptive-sim svg .node { fill:var(--card); stroke:var(--viz-series-1); stroke-width:3; }
    #offroad-adaptive-sim svg .goal { fill:var(--viz-series-1); }
    #offroad-adaptive-sim svg .ugv-body { fill:light-dark(#52616d, #a9b7c0); stroke:var(--foreground); stroke-width:1.4; }
    #offroad-adaptive-sim svg .ugv-deck { fill:light-dark(#6f7f61, #7f916f); stroke:var(--foreground); stroke-width:1.2; }
    #offroad-adaptive-sim svg .ugv-wheel { fill:light-dark(#252b2e, #111619); stroke:var(--foreground); stroke-width:1; }
    #offroad-adaptive-sim svg .ugv-sensor { fill:var(--viz-series-1); }
    #offroad-adaptive-sim svg .load-crate { fill:var(--sim-autumn-2); stroke:var(--foreground); stroke-width:1; }
    #offroad-adaptive-sim svg .sensor-range { fill:color-mix(in srgb, var(--viz-series-1) 12%, transparent); stroke:color-mix(in srgb, var(--viz-series-1) 70%, transparent); stroke-width:2; stroke-dasharray:7 7; }
    #offroad-adaptive-sim svg .vio-frustum { fill:color-mix(in srgb, var(--green) 13%, transparent); stroke:color-mix(in srgb, var(--green) 78%, transparent); stroke-width:2; stroke-dasharray:5 5; }
    #offroad-adaptive-sim svg .vio-feature { fill:var(--green); stroke:var(--card); stroke-width:1.2; }
    #offroad-adaptive-sim svg .vio-camera { fill:var(--green); stroke:var(--card); stroke-width:1.4; }
    #offroad-adaptive-sim svg .vio-trail { fill:none; stroke:var(--green); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; opacity:.9; }
    #offroad-adaptive-sim svg .frontier-marker { fill:var(--card); stroke:var(--viz-series-1); stroke-width:3; }
    #offroad-adaptive-sim svg .frontier-label { paint-order:stroke; stroke:var(--card); stroke-width:5px; stroke-linejoin:round; }
    #offroad-adaptive-sim svg .goal-beacon { fill:var(--viz-series-1); stroke:var(--card); stroke-width:4; }
    #offroad-adaptive-sim svg .goal-ring { fill:none; stroke:var(--viz-series-1); stroke-width:3; stroke-dasharray:6 6; }
    #offroad-adaptive-sim .sr-status { min-height:1.4em; margin-top:7px; color:var(--muted-foreground); }
    #offroad-adaptive-sim .live-panel { display:flex; flex-direction:column; min-height:100%; padding:12px; }
    #offroad-adaptive-sim .live-panel h3 { margin:0 0 10px; }
    #offroad-adaptive-sim .stage-list { display:grid; gap:7px; margin-bottom:12px; }
    #offroad-adaptive-sim .stage-item { display:grid; grid-template-columns:16px 1fr; align-items:start; gap:8px; color:var(--muted-foreground); }
    #offroad-adaptive-sim .stage-dot { width:11px; height:11px; border-radius:50%; background:var(--muted); margin-top:4px; }
    #offroad-adaptive-sim .stage-item.active { color:var(--foreground); font-weight:500; }
    #offroad-adaptive-sim .stage-item.active .stage-dot { background:var(--viz-series-1); box-shadow:0 0 0 4px color-mix(in srgb, var(--viz-series-1) 18%, transparent); }
    #offroad-adaptive-sim .stage-item.done .stage-dot { background:var(--green); }
    #offroad-adaptive-sim .log-title { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:2px 0 7px; }
    #offroad-adaptive-sim .event-log { list-style:none; padding:0; margin:0; display:grid; gap:5px; max-height:220px; overflow:auto; }
    #offroad-adaptive-sim .event-log li { display:grid; grid-template-columns:48px 1fr; gap:8px; padding:7px 0; border-top:1px solid var(--border); }
    #offroad-adaptive-sim .event-log time { color:var(--viz-series-1); font-variant-numeric:tabular-nums; }
    #offroad-adaptive-sim .event-log .empty-log { display:block; color:var(--muted-foreground); border-top:0; }
    @media (max-width:720px) {
      #offroad-adaptive-sim .main-grid { grid-template-columns:1fr; }
      #offroad-adaptive-sim .sim-stats { grid-template-columns:1fr; }
      #offroad-adaptive-sim .compare-grid { grid-template-columns:1fr; }
      #offroad-adaptive-sim .compare-side.right { text-align:left; }
      #offroad-adaptive-sim .compare-arrow { transform:rotate(90deg); }
      #offroad-adaptive-sim .map-caption { max-width:76%; }
    }
    @media (prefers-reduced-motion: reduce) {
      #offroad-adaptive-sim * { scroll-behavior:auto !important; transition:none !important; }

        &lt;span class=&quot;compare-time tabular-nums&quot; id=&quot;adaptive-result&quot;&gt;—&lt;/span&gt;
        &lt;span class=&quot;text-muted&quot;&gt;학습된 비용으로 평탄한 미지 Frontier 선택&lt;/span&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;offroad-adaptive-sim&#x27;);
      const $ = (s) =&gt; root.querySelector(s);
      const directPath = $(&#x27;#direct-route&#x27;);
      const detourPath = $(&#x27;#detour-route&#x27;);
      const activePath = $(&#x27;#active-route&#x27;);
      const oldPath = $(&#x27;#old-route&#x27;);
      const ugv = $(&#x27;#ugv&#x27;);
      const payloadSelect = $(&#x27;#payload-select&#x27;);
      const speedSelect = $(&#x27;#speed-select&#x27;);
      const elapsedValue = $(&#x27;#elapsed-value&#x27;);
      const speedValue = $(&#x27;#speed-value&#x27;);
      const speedContext = $(&#x27;#speed-context&#x27;);
      const costValue = $(&#x27;#cost-value&#x27;);
      const routeContext = $(&#x27;#route-context&#x27;);
      const phaseTitle = $(&#x27;#phase-title&#x27;);
      const phaseDetail = $(&#x27;#phase-detail&#x27;);
      const eventBanner = $(&#x27;#event-banner&#x27;);
      const timeline = $(&#x27;.timeline&#x27;);
      const timelineBar = $(&#x27;#timeline-bar&#x27;);
      const comparison = $(&#x27;#comparison&#x27;);
      const statusLine = $(&#x27;#status-line&#x27;);
      const cost1 = $(&#x27;#cost-zone-1&#x27;);
      const cost2 = $(&#x27;#cost-zone-2&#x27;);
      const loadCrate = $(&#x27;#load-crate&#x27;);
      const eventLog = $(&#x27;#event-log&#x27;);
      const logMode = $(&#x27;#log-mode&#x27;);
      const stageItems = [...root.querySelectorAll(&#x27;.stage-item&#x27;)];
      const revealHoles = $(&#x27;#reveal-holes&#x27;);
      const sensorVisual = $(&#x27;#sensor-visual&#x27;);
      const frontierA = $(&#x27;#frontier-a&#x27;);
      const frontierB = $(&#x27;#frontier-b&#x27;);
      const vioTrail = $(&#x27;#vio-trail&#x27;);
      const vioLandmarks = [...root.querySelectorAll(&#x27;#vio-landmarks .vio-feature&#x27;)];
      let raf = null;
      let run = null;
      let results = { static: null, adaptive: null };
      let eventTimer = null;
      let runCount = 0;
      let lastReveal = { x:78, y:386 };
      let vioTrailPoints = [{ x:78, y:386 }];
      let syncingState = false;

      const saved = window.openai?.widgetState?.privateContent || {};
      if (saved.payload === &#x27;empty&#x27; || saved.payload === &#x27;loaded&#x27;) payloadSelect.value = saved.payload;
      if ([&#x27;1&#x27;,&#x27;2&#x27;,&#x27;4&#x27;].includes(String(saved.speed))) speedSelect.value = String(saved.speed);

      function saveState() {
        if (syncingState) return;
        window.openai?.setWidgetState?.({
          modelContent: { payload: payloadSelect.value, completed: Object.keys(results).filter(k =&gt; results[k] !== null) },
          privateContent: { payload: payloadSelect.value, speed: speedSelect.value }
        }).catch(() =&gt; {});
      }

      function showEvent(text) {
        clearTimeout(eventTimer);
        eventBanner.textContent = text;
        eventBanner.classList.add(&#x27;show&#x27;);
        eventTimer = setTimeout(() =&gt; eventBanner.classList.remove(&#x27;show&#x27;), 1300);
      }

      function setStage(index) {
        stageItems.forEach((item, i) =&gt; {
          item.classList.toggle(&#x27;active&#x27;, i === index);
          item.classList.toggle(&#x27;done&#x27;, i &lt; index);
        });
      }

      function clearLog(mode) {
        const empty = eventLog.querySelector(&#x27;.empty-log&#x27;);
        if (empty) empty.remove();
        runCount += 1;
        logMode.textContent = mode === &#x27;static&#x27; ? &#x27;목표지향 탐색&#x27; : mode === &#x27;adaptive&#x27; ? &#x27;경험기반 탐색&#x27; : &#x27;대기&#x27;;
        logEvent(0, `실행 ${runCount} 시작 · ${logMode.textContent} · ${payloadSelect.options[payloadSelect.selectedIndex].text}`);
      }

      function resetFog() {
        revealHoles.innerHTML = &#x27;&lt;circle cx=&quot;78&quot; cy=&quot;386&quot; r=&quot;88&quot; fill=&quot;black&quot;/&gt;&#x27;;
        sensorVisual.setAttribute(&#x27;transform&#x27;, &#x27;translate(78 386)&#x27;);
        frontierA.setAttribute(&#x27;hidden&#x27;, &#x27;&#x27;);
        frontierB.setAttribute(&#x27;hidden&#x27;, &#x27;&#x27;);
        lastReveal = { x:78, y:386 };
      }

      function revealAt(x, y) {
        sensorVisual.setAttribute(&#x27;transform&#x27;, `translate(${x} ${y})`);
        if (Math.hypot(x-lastReveal.x, y-lastReveal.y) &lt; 22) return;
        const hole = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;circle&#x27;);
        hole.setAttribute(&#x27;cx&#x27;, x.toFixed(1));
        hole.setAttribute(&#x27;cy&#x27;, y.toFixed(1));
        hole.setAttribute(&#x27;r&#x27;, &#x27;82&#x27;);
        hole.setAttribute(&#x27;fill&#x27;, &#x27;black&#x27;);
        revealHoles.append(hole);
        lastReveal = { x, y };
      }

      function resetVio() {
        vioTrailPoints = [{ x:78, y:386 }];
        vioTrail.setAttribute(&#x27;d&#x27;, &#x27;M78 386&#x27;);
        vioLandmarks.forEach(mark =&gt; mark.setAttribute(&#x27;opacity&#x27;, &#x27;0&#x27;));
      }

      function updateVio(point, p, elapsed) {
        const last = vioTrailPoints[vioTrailPoints.length - 1];
        if (Math.hypot(point.x-last.x, point.y-last.y) &gt;= 5) {
          const driftX = Math.sin(elapsed * .7) * .8 * p;
          const driftY = Math.cos(elapsed * .55) * .55 * p;
          vioTrailPoints.push({ x:point.x + driftX, y:point.y + driftY });
          vioTrail.setAttribute(&#x27;d&#x27;, vioTrailPoints.map((q,i) =&gt; `${i ? &#x27;L&#x27; : &#x27;M&#x27;}${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(&#x27; &#x27;));
        }
        const theta = point.angle * Math.PI / 180;
        const c = Math.cos(theta), s = Math.sin(theta);
        vioLandmarks.forEach(mark =&gt; {
          const dx = Number(mark.getAttribute(&#x27;cx&#x27;)) - point.x;
          const dy = Number(mark.getAttribute(&#x27;cy&#x27;)) - point.y;
          const localX = c*dx + s*dy;
          const localY = -s*dx + c*dy;
          const coneHalfWidth = 16 + Math.max(0, localX-22) * (48/123);
          const visible = localX &gt;= 22 &amp;&amp; localX &lt;= 145 &amp;&amp; Math.abs(localY) &lt;= coneHalfWidth;
          mark.setAttribute(&#x27;opacity&#x27;, visible ? &#x27;1&#x27; : &#x27;0&#x27;);
        });
      }

      function logEvent(seconds, text) {
        const empty = eventLog.querySelector(&#x27;.empty-log&#x27;);
        if (empty) empty.remove();
        const item = document.createElement(&#x27;li&#x27;);
        const time = document.createElement(&#x27;time&#x27;);
        const message = document.createElement(&#x27;span&#x27;);
        time.textContent = `${seconds.toFixed(1)}s`;
        message.textContent = text;
        item.append(time, message);
        eventLog.append(item);
        eventLog.scrollTop = eventLog.scrollHeight;
      }

      function routePoint(mode, p) {
        const directLen = directPath.getTotalLength();
        const branchPoint = directLen * 0.49;
        if (mode !== &#x27;adaptive&#x27; || p &lt; 0.48 || payloadSelect.value === &#x27;empty&#x27;) {
          const frac = mode === &#x27;adaptive&#x27; &amp;&amp; payloadSelect.value === &#x27;loaded&#x27; ? Math.min(p / 0.48 * 0.49, 0.49) : p;
          const a = directPath.getPointAtLength(directLen * frac);
          const b = directPath.getPointAtLength(Math.min(directLen, directLen * frac + 2));
          return { x:a.x, y:a.y, angle:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI };
        }
        const dp = (p - 0.48) / 0.52;
        const detourLen = detourPath.getTotalLength();
        const a = detourPath.getPointAtLength(detourLen * dp);
        const b = detourPath.getPointAtLength(Math.min(detourLen, detourLen * dp + 2));
        return { x:a.x, y:a.y, angle:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI };
      }

      function durationFor(mode) {
        const loaded = payloadSelect.value === &#x27;loaded&#x27;;
        if (!loaded) return mode === &#x27;static&#x27; ? 15.4 : 15.7;
        return mode === &#x27;static&#x27; ? 28.6 : 21.2;
      }

      function motionProgress(mode, t) {
        const loaded = payloadSelect.value === &#x27;loaded&#x27;;
        if (!loaded) return t;
        const segments = mode === &#x27;static&#x27;
          ? [[0,.18,.12],[.18,.35,.28],[.35,.50,.13],[.50,.68,.30],[.68,1,.17]]
          : [[0,.18,.14],[.18,.35,.30],[.35,.48,.14],[.48,1,.42]];
        let timeStart = 0;
        for (const [p0,p1,dt] of segments) {
          if (t &lt;= timeStart + dt || timeStart + dt &gt;= 1) {
            const local = Math.max(0, Math.min(1, (t-timeStart)/dt));
            return p0 + (p1-p0)*local;
          }
          timeStart += dt;
        }
        return 1;
      }

      function updateRouteVisual(mode, p) {
        const adaptiveLoaded = mode === &#x27;adaptive&#x27; &amp;&amp; payloadSelect.value === &#x27;loaded&#x27;;
        if (adaptiveLoaded &amp;&amp; p &gt;= 0.35) {
          cost1.classList.add(&#x27;hot&#x27;); cost2.classList.add(&#x27;hot&#x27;);
          costValue.textContent = p &lt; 0.48 ? &#x27;2.35&#x27; : &#x27;2.70&#x27;;
        } else {
          cost1.classList.remove(&#x27;hot&#x27;); cost2.classList.remove(&#x27;hot&#x27;);
          costValue.textContent = &#x27;1.00&#x27;;
        }
